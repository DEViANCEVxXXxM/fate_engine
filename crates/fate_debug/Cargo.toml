[package]
name = "fate_debug"
version = "0.1.0"
edition = "2024"

[dependencies]
fate_engine = { path = "../.." }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "x11", "wayland"] }
egui-wgpu = { version = "0.37.0", default-features = false }
wgpu = "30.0.1"
winit = "0.30.13"
log = "0.4.35"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm"] }
