name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The repository's local .cargo/config.toml redirects target-dir to a
  # Windows drive. Override it so CI uses the checkout's own target directory.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  headless:
    name: Headless quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The combat slice reads Linux controllers through `gilrs`, whose
      # `libudev-sys` dependency resolves the native library with pkg-config.
      # The engine's audio output resolves ALSA the same way through `cpal`.
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run headless consumer smoke test
        run: cargo run -p fate_consumer_smoke --locked

  headless-windows:
    name: Windows headless baseline
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check portable Polygon CPU results
        run: cargo test -p fate_polygon --locked

      - name: Run headless consumer smoke test
        run: cargo run -p fate_consumer_smoke --locked
