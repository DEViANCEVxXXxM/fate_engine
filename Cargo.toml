[package]
name = "fate_engine"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/fate_net",
    "crates/fate_sim",
    "crates/fate_sim_bench",
    "projects/combat_slice",
    "projects/consumer_smoke",
    "projects/demo",
    "projects/window_smoke",
]
default-members = ["projects/demo"]
resolver = "3"

[dependencies]
bytemuck = "1.25.2"
log = "0.4.35"
wgpu = "30.0.1"
winit = "0.30.13"

[dev-dependencies]
pollster = "1.0.1"
